services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fastsme
      POSTGRES_USER: fastshop
      POSTGRES_PASSWORD: fastshop-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastshop -d fastsme"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - fastshop-postgres:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DB_URL: postgresql://fastshop:fastshop-local@db:5432/fastsme
      DB_SCHEMA: fast_shop
      FASTSHOP_ENV: development
      FASTSHOP_AUTO_CREATE_SCHEMA: "0"
      FASTSHOP_PUBLIC_URL: http://localhost:5025
    ports:
      - "5025:5025"
    depends_on:
      db:
        condition: service_healthy

volumes:
  fastshop-postgres:

