[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastshop"
version = "0.1.0"
description = "FastHTML commerce storefront and merchant operations platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2",
  "python-fasthtml>=0.12,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "F811"]
